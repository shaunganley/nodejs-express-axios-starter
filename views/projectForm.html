<!DOCTYPE html>
<html>
    <head>
        <title>Creating a Project</title>
    </head>
    <body>
        <h1>
            Create Project
        </h1>

        {% if errormessage %}
        <h3>{{ errormessage }}</h3>
        {% endif %}

        <form class="form" action="/projectForm" method="post">
            <h3>
                <label for="name">
                    Name of Project: 
                </label>
            </h3>
            <input id="ProjectName" name="ProjectName" value="{{projectName}}" type="text">
      
            <h3>
                <label for="name">
                    Value: 
                </label>
            </h3>
            <input id="ProjectValue" name="ProjectValue" value="{{projectValue}}" type="text">
          
            <h3>
                <label for="name">
                    ClientID: 
                </label>
            </h3>
            <input id="ClientID" name="ClientID" value="{{clientID}}" type="text">
            <br></br>
            <button id="submit">Submit</button>
      </form>
    </body>
</html>
